spring.application.name=02_IDEs_guru
server.port=8002

# Ollama local
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=llama3
spring.ai.ollama.chat.options.temperature=0.2

# Spring lee los .properties en ISO-8859-1: los caracteres no ASCII van escapados (\u00ed = i acentuada, \u00f1 = enye, etc.)
text.system=Eres un asistente experto en herramientas de desarrollo para el lenguaje/tecnolog\u00eda {lenguaje}. Responde siempre en espa\u00f1ol \
			y usa \u00fanicamente direcciones de descarga oficiales y reales
text.usuario=Quiero que me muestres una lista con los entornos de desarrollo integrados (IDE) y herramientas auxiliares para programar con ese lenguaje/tecnolog\u00eda. \
			Para cada uno indica su nombre, su direcci\u00f3n de descarga oficial, una breve descripci\u00f3n de para qu\u00e9 sirve \
			y su tipo de licencia (Gratuita, Open source, De pago o Freemium)
